apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    reactNativeDir = file('../../node_modules/react-native')
    codegenDir = file('../../../../../node_modules/@react-native/codegen')
    jsRootDir = file('../src')
    libraryName = 'MoGoNativeSpec'
    codegenJavaPackageName = 'com.mogo.nativecore'
}
android {
    namespace 'com.mogo.nativecore'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                    "-DMOGO_FEATURE_PERSONAL_FINANCE=${project.findProperty('mogoFeaturePersonalFinance') ?: 'ON'}",
                    "-DMOGO_FEATURE_USER_PROFILE=${project.findProperty('mogoFeatureUserProfile') ?: 'ON'}"
            }
        }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main.java.srcDirs += "${buildDir}/generated/source/codegen/java"
}
dependencies { implementation 'com.facebook.react:react-android' }
